name: Build TV page

on:
  schedule:
    # Каждый день в 17:00 МСК (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Build EPG
        id: epg
        continue-on-error: true
        run: python build_epg.py

      - name: Warn if EPG failed
        if: steps.epg.outcome == 'failure'
        run: echo "::warning::EPG не обновился, сайт деплоится со старым epg_data.json"

      - name: Ensure epg_data.json exists
        run: |
          if [ ! -s epg_data.json ]; then
            echo "⚠ EPG не собран — создаю пустой, чтобы build.py не упал"
            echo '{}' > epg_data.json
          fi

      - name: Build HTML
        run: python build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
