<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТВ Онлайн</title>

<!-- Video.js CSS -->
<link href="https://vjs.zencdn.net/8.23.8/video-js.css" rel="stylesheet" />
<!-- Плагин для выбора качества -->
<link href="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-menu@1.0.3/dist/videojs-contrib-quality-menu.css" rel="stylesheet">

<link rel="stylesheet" href="static/style.css">
</head>
<body>

  <!-- Основной контейнер -->
  <div class="layout">
    
    <!-- Верхняя часть: Плеер и Инфо-панель -->
    <div class="top-row">
      
      <!-- Плеер -->
      <div class="player-wrapper">
        <!-- Заглушка -->
        <div class="video-placeholder" id="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M10 9l5 3-5 3V9z" fill="currentColor" stroke="none"/>
          </svg>
          <p>Выберите канал ниже</p>
        </div>
        
        <!-- Контейнер для Video.js -->
        <div id="video-container" style="width: 100%; height: 100%; display: none;">
          <video id="video" class="video-js vjs-big-play-centered vjs-fluid" controls preload="auto" playsinline></video>
        </div>
      </div>

      <!-- Панель информации справа (как в референсе) -->
      <div class="info-panel">
        <div class="channel-header">
          <div class="big-logo" id="infoLogo">1</div>
          <div class="channel-title" id="infoTitle">Первый Канал</div>
        </div>
        <div class="epg-list">
          <!-- Здесь в будущем может быть сетка передач. Пока просто заполним заглушками для красоты -->
          <div class="epg-item">
            <span class="epg-time">Сейчас</span>
            <span class="epg-name" id="nowPlaying">Выберите канал</span>
          </div>
          <div class="epg-item">
            <span class="epg-time">Далее</span>
            <span class="epg-name">Программа передач</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Нижняя часть: Карусель каналов -->
    <div class="carousel-wrapper">
      <button class="scroll-btn" id="scrollLeftBtn" style="display: none;">‹</button>
      <div class="channel-carousel" id="channelList">
        <!-- Список генерируется через JS -->
      </div>
      <button class="scroll-btn" id="scrollRightBtn">›</button>
    </div>

  </div>

<script>
  const ENCODED_CHANNELS = $CHANNELS;
</script>
<script src="https://vjs.zencdn.net/8.23.8/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-menu@1.0.3/dist/videojs-contrib-quality-menu.min.js"></script>
<script src="static/app.js"></script>
</body>
</html>
