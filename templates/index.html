<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <title>ТВ онлайн</title>

  <!-- Шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Video.js -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">

  <!-- Стили проекта -->
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="layout">

    <!-- ============================================================
         ВЕРХНИЙ РЯД: ПЛЕЕР + ПАНЕЛЬ КАНАЛА
         ============================================================ -->
    <div class="top-row">

      <!-- Левая колонка: плеер -->
      <div class="video-column">
        <div class="player-wrapper">
          <div id="video-container">
            <video
              id="video"
              class="video-js vjs-default-skin"
              playsinline
              controls
              preload="auto"
            ></video>

            <!-- Плейсхолдер до первого выбора канала -->
            <div id="placeholder" class="video-placeholder">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
              </svg>
              <div>Выберите канал</div>
            </div>
          </div>
        </div>

        <!-- Баннер "сейчас идёт" под плеером (виден только на мобильных) -->
        <div id="nowPlayingBanner" class="now-playing-banner" style="display:none;">
          <span id="nowPlayingText"></span>
        </div>
      </div>

      <!-- Правая колонка: панель с информацией о канале и программой -->
      <aside class="info-panel">

                <!-- Заголовок канала + кнопка "избранное" -->
        <div class="channel-header">
          <div class="big-logo" id="infoLogo"></div>
          <div class="channel-title" id="infoTitle">Выберите канал</div>
          <button class="fav-toggle" id="favToggle" title="В избранное" aria-label="В избранное">
            <svg viewBox="0 0 24 24" class="heart-icon">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
        </div>

                <!-- Дата и день недели -->
        <div class="epg-date-header" id="epgDateHeader"></div>

        <!-- Вкладки по дням -->
        <div class="epg-tabs">
          <button class="epg-tab active" data-day="0">Сегодня</button>
          <button class="epg-tab" data-day="1">Завтра</button>
        </div>

        <!-- Список передач -->
        <div class="epg-list" id="epgList"></div>
        <button id="epgShowMoreBtn" class="epg-show-more" style="display: none;">Показать ещё</button>

      </aside>

    </div>


   <!-- ============================================================
         ФИЛЬТРЫ И ПОИСК
         ============================================================ -->
    <div class="filters-wrapper">
      <!-- Стрелка прокрутки фильтров влево (ПК) -->
      <button class="filters-arrow filters-arrow-left" id="filtersArrowLeft" aria-label="Прокрутить категории влево">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>

      <!-- Кнопка-лупа -->
      <button class="search-toggle-btn" id="searchToggleBtn" aria-label="Поиск канала">
        <svg viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>

           <!-- Поле поиска (скрыто по умолчанию) -->
      <div class="search-input-wrapper">
        <!-- Иконка лупы внутри поля -->
        <svg class="search-inner-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        
        <input
          type="text"
          id="channelSearch"
          class="channel-search"
          placeholder="Поиск канала..."
          autocomplete="off"
          spellcheck="false"
        >
        <button class="search-close-btn" id="searchCloseBtn" aria-label="Закрыть поиск">
          <svg viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <!-- Сами фильтры -->
            <button class="filter-btn" data-filter="favorites">
        <svg viewBox="0 0 24 24" class="filter-heart">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span id="favCountLabel">Любимые</span>
      </button>
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="federal">Федеральные</button>
      <button class="filter-btn" data-filter="sport">Спортивные</button>
      <button class="filter-btn" data-filter="cinema">Кино и сериалы</button>
      <button class="filter-btn" data-filter="edu">Познавательные</button>
      <button class="filter-btn" data-filter="kids">Детские</button>
      <button class="filter-btn" data-filter="entertainment">Развлекательные</button>
      <button class="filter-btn" data-filter="news">Новостные</button>
      <button class="filter-btn" data-filter="music">Музыкальные</button>

      <!-- Стрелка прокрутки фильтров вправо (ПК) -->
      <button class="filters-arrow filters-arrow-right" id="filtersArrowRight" aria-label="Прокрутить категории вправо">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
      </button>
    </div>

    <!-- ============================================================
         КАРУСЕЛЬ КАНАЛОВ
         ============================================================ -->
    <div class="carousel-wrapper">
      <button id="scrollLeftBtn" class="scroll-btn" aria-label="Прокрутить влево">‹</button>
      <div class="channel-carousel" id="channelList"></div>
      <button id="scrollRightBtn" class="scroll-btn" aria-label="Прокрутить вправо">›</button>
    </div>

  </div>

  <!-- ============================================================
       ДАННЫЕ (подставляются build.py)
       ============================================================ -->
  <script>
    // Зашифрованный base64 список каналов (подставляет build.py)
    const ENCODED_CHANNELS = $CHANNELS;

    // Программа передач подгружается отдельным файлом (см. loadEpg в app.js)
    let EPG_DATA = {};
  </script>

  <!-- Video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <!-- VHS (для HLS) -->
  <script src="https://unpkg.com/@videojs/http-streaming@3.10.0/dist/videojs-http-streaming.min.js"></script>

     <!-- Подсказка про двойной тап (внутри контейнера тостов) -->
  <div id="toastContainer" class="toast-container">
    <div id="mobileTip" class="toast toast-tip">
      <span class="toast-text"><b>Совет:</b> Дважды нажмите на карточку канала, чтобы добавить его в «Любимые».</span>
    </div>
  </div>

    <!-- hls.js (основной движок для HLS) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

  <!-- Логика приложения -->
  <script src="static/app.js"></script>
</body>
</html>
